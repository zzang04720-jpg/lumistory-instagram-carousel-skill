<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
__FONT_FACE_CSS__
html, body { margin: 0; padding: 0; }

#slide {
  width: 1080px;
  height: 1350px;
  position: relative;
  overflow: hidden;
  background: #F7F3EC;
  color: #111;
  box-sizing: border-box;
  padding: 84px 72px;
  display: flex;
  flex-direction: column;
  font-family: 'Pretendard', sans-serif;
  word-break: keep-all;
  overflow-wrap: break-word;
  line-break: strict;
}

.corner { position: absolute; width: 44px; height: 44px; z-index: 2; }
.corner.tl { top: 36px; left: 36px; border-top: 6px solid #111; border-left: 6px solid #111; }
.corner.tr { top: 36px; right: 36px; border-top: 6px solid #111; border-right: 6px solid #111; }
.corner.bl { bottom: 36px; left: 36px; border-bottom: 6px solid #111; border-left: 6px solid #111; }
.corner.br { bottom: 36px; right: 36px; border-bottom: 6px solid #111; border-right: 6px solid #111; }

.kicker {
  position: relative; z-index: 1;
  font-weight: 800;
  font-size: 28px;
  color: __ACCENT_HEX__;
  letter-spacing: 0.5px;
  margin-bottom: 20px;
}

.heading {
  position: relative; z-index: 1;
  font-family: 'Jua', 'Pretendard', sans-serif;
  font-weight: 700;
  font-size: 68px;
  line-height: 1.38;
  letter-spacing: -0.5px;
  color: #111;
  margin: 0 0 42px 0;
}
.heading .accent { color: __ACCENT_HEX__; }

.main-block {
  flex: 1;
  min-height: 0;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: 36px;
}

.body-stack { display: flex; flex-direction: column; gap: 22px; }

/* ---- 공통 박스 ---- */
.box {
  background: #fff;
  border: 3px solid #111;
  border-radius: 20px;
  box-sizing: border-box;
}
.box.accent-border { border-color: __ACCENT_HEX__; }

/* ---- 아이콘 + 라벨/설명 리스트 박스 ---- */
.box-row {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 26px 30px;
}
.box-row .icon { flex: none; font-size: 46px; line-height: 1; }
.box-row .text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box-row .label { font-weight: 800; font-size: 33px; line-height: 1.4; color: #111; }
.box-row .desc { font-weight: 500; font-size: 25px; line-height: 1.45; color: rgba(17,17,17,0.58); }

/* ---- 2x2 그리드 박스 ---- */
.grid-2x2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.grid-2x2 .cell {
  background: #fff;
  border: 3px solid #111;
  border-radius: 20px;
  padding: 30px 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
}
.grid-2x2 .cell .icon { font-size: 46px; line-height: 1; }
.grid-2x2 .cell .label { font-weight: 800; font-size: 25px; letter-spacing: 0.3px; color: #111; }
.grid-2x2 .cell .desc { font-weight: 500; font-size: 23px; line-height: 1.4; color: rgba(17,17,17,0.58); }

/* ---- 1열 스택 리스트 ---- */
.stack-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.stack-row {
  display: flex;
  align-items: stretch;
  background: #fff;
  border: 3px solid #111;
  border-radius: 20px;
  box-sizing: border-box;
  overflow: hidden;
}
.stack-index {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 86px;
  background: #111;
  color: #fff;
  font-weight: 800;
  font-size: 30px;
  flex: none;
}
.stack-info {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px 22px;
  min-width: 0;
  flex: 1;
}
.stack-icon { font-size: 34px; line-height: 1; }
.stack-desc {
  font-weight: 600;
  font-size: 26px;
  line-height: 1.45;
  color: rgba(17,17,17,0.7);
  min-width: 0;
}

/* ---- 통계형 3분할 박스 ---- */
.stat-row { display: flex; gap: 18px; }
.stat-row .stat {
  flex: 1;
  background: #fff;
  border: 3px solid #111;
  border-radius: 18px;
  padding: 26px 10px;
  text-align: center;
  box-sizing: border-box;
}
.stat-row .stat .value { font-weight: 800; font-size: 40px; color: #111; }
.stat-row .stat .divider { border: none; border-top: 3px solid __ACCENT_HEX__; width: 34px; margin: 12px auto; }
.stat-row .stat .label { font-weight: 600; font-size: 22px; color: rgba(17,17,17,0.58); }

/* ---- 강조(레드 테두리) 메시지 박스 ---- */
.box-highlight {
  padding: 30px 32px;
  text-align: center;
}
.box-highlight .msg { font-weight: 800; font-size: 30px; line-height: 1.55; color: #111; }
.box-highlight .msg .accent { color: __ACCENT_HEX__; }

.note-text {
  font-weight: 500;
  font-size: 25px;
  line-height: 1.5;
  color: rgba(17,17,17,0.55);
}

.page-footer {
  position: absolute;
  bottom: 46px;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.page-dash { width: 26px; height: 3px; background: __ACCENT_HEX__; border-radius: 2px; }
.page-num { font-weight: 700; font-size: 26px; color: #111; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="slide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="kicker">__KICKER_TEXT__</div>
    <h1 class="heading">__HEADING__</h1>
    <div class="main-block">
      <div class="body-stack">
        __BODY_HTML__
      </div>
    </div>
    <div class="page-footer">
      <span class="page-dash"></span>
      <span class="page-num">__PAGE_NUM__ / __TOTAL_PAGES__</span>
      <span class="page-dash"></span>
    </div>
  </div>
</body>
</html>
