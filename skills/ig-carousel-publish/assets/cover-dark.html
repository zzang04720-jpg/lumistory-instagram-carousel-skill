<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  #slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background-image: url("__BG_IMAGE__");
    background-size: cover;
    background-position: center;
    background-color: #0a0a0a;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 0 72px;
    box-sizing: border-box;
    /* #slide가 flex column + justify-content:center라서 이 블록이 자동으로
       수직 중간쯽(약간 위)에 위치한다 — 맨 위에 붙어있던 기존 레이아웃 수정 */
  }
  .badge {
    display: inline-block;
    font-family: 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.5px;
    color: __ACCENT_HEX__;
    background: rgba(__ACCENT_RGB__, 0.16);
    border: 1px solid rgba(__ACCENT_RGB__, 0.55);
    padding: 14px 28px;
    border-radius: 999px;
    margin-bottom: 40px;
  }
  .title {
    font-family: 'Pretendard', sans-serif;
    font-weight: 800;
    font-size: var(--title-font-size, 104px);
    line-height: 1.22;
    color: #ffffff;
    margin: 0 0 32px 0;
    letter-spacing: -1px;
    max-width: 890px;
  }
  .title-line {
    display: block;
  }
  .title .accent {
    color: __ACCENT_HEX__;
  }
  .title .mono {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
  }
  .subtitle {
    font-family: 'Pretendard', sans-serif;
    font-weight: 500;
    font-size: 46px;
    line-height: 1.45;
    color: rgba(255,255,255,0.7);
    margin: 0;
  }
  .subtitle .mono {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .footer {
    position: absolute;
    left: 72px;
    bottom: 90px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: 'Pretendard', sans-serif;
    font-weight: 500;
    font-size: 28px;
    color: rgba(255,255,255,0.55);
  }
  .footer .line {
    flex: 0 0 64px;
    height: 1px;
    background: rgba(255,255,255,0.3);
  }
  .handle-mark {
    position: absolute;
    top: 56px;
    left: 72px;
    z-index: 2;
    font-family: 'Pretendard', sans-serif;
    font-weight: 500;
    font-size: 28px;
    color: rgba(255,255,255,0.40);
    letter-spacing: 0.3px;
  }
  /* 우측 하단 카테고리 색 블록 — 디자인 포인트(배경색 자체는 항상 #0a0a0a로 고정, 이 글로우는
     장식용 오버레이일 뿐 배경을 바꾸지 않는다) */
  .corner-mark {
    position: absolute;
    right: -120px; bottom: -120px;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(__ACCENT_RGB__, 0.22) 0%, rgba(__ACCENT_RGB__, 0) 70%);
    z-index: 2;
  }
</style>
</head>
<body>
  <div id="slide">
    <div class="overlay"></div>
    <span class="handle-mark">@__HANDLE__</span>
    <div class="corner-mark"></div>
    <div class="content">
      <span class="badge">__BADGE_TEXT__</span>
      <h1 class="title" style="__TITLE_STYLE__">__TITLE__</h1>
      <p class="subtitle">__SUBTITLE__</p>
    </div>
    <div class="footer">
      <span>__FOOTER_TEXT__</span>
      <span class="line"></span>
    </div>
  </div>
</body>
</html>
