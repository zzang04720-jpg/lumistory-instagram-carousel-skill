<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  __FONT_FACE_CSS__
  html, body { margin: 0; padding: 0; }

  #slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #FAF7F2;
    color: #111;
    box-sizing: border-box;
    padding: 88px 80px;
    display: flex;
    flex-direction: column;
    font-family: 'Pretendard', sans-serif;
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .corner { position: absolute; width: 46px; height: 46px; z-index: 2; }
  .corner.tl { top: 40px; left: 40px; border-top: 6px solid __ACCENT_HEX__; border-left: 6px solid __ACCENT_HEX__; }
  .corner.tr { top: 40px; right: 40px; border-top: 6px solid __ACCENT_HEX__; border-right: 6px solid __ACCENT_HEX__; }
  .corner.bl { bottom: 40px; left: 40px; border-bottom: 6px solid __ACCENT_HEX__; border-left: 6px solid __ACCENT_HEX__; }
  .corner.br { bottom: 40px; right: 40px; border-bottom: 6px solid __ACCENT_HEX__; border-right: 6px solid __ACCENT_HEX__; }

  .handle {
    position: relative; z-index: 1;
    font-weight: 700; font-size: 30px; color: rgba(17,17,17,0.5);
    margin-bottom: 40px;
  }

  .badge {
    position: relative; z-index: 1;
    display: inline-block;
    font-family: '__HANDWRITING_FONT__', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 50px;
    line-height: 1.5;
    color: #fff;
    background: __ACCENT_HEX__;
    border: 3px solid #111;
    padding: 12px 32px;
    border-radius: 999px;
    margin-bottom: 44px;
    align-self: flex-start;
  }

  .main-block {
    flex: 1;
    min-height: 0;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title { font-family: '__HANDWRITING_FONT__', 'Pretendard', sans-serif; font-weight: 700; line-height: 1.5; letter-spacing: -1px; margin: 0 0 44px 0; }
  .title .title-line { display: block; }

  .subtitle {
    font-weight: 700;
    font-size: 42px;
    line-height: 1.5;
    color: rgba(17,17,17,0.82);
  }

  .footer-text {
    position: relative; z-index: 1;
    font-weight: 700;
    font-size: 30px;
    color: rgba(17,17,17,0.45);
  }

  .progress {
    position: absolute;
    bottom: 58px;
    right: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 28px;
    color: rgba(17,17,17,0.4);
    z-index: 2;
  }
</style>
</head>
<body>
  <div id="slide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="handle">@__HANDLE__</div>
    <span class="badge">__BADGE_TEXT__</span>
    <div class="main-block">
      <h1 class="title" style="__TITLE_STYLE__">__TITLE__</h1>
      <div class="subtitle">__SUBTITLE__</div>
    </div>
    <div class="footer-text">__FOOTER_TEXT__</div>
    <div class="progress">__PAGE_NUM__/__TOTAL_PAGES__</div>
  </div>
</body>
</html>
