<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
__FONT_FACE_CSS__
html, body { margin: 0; padding: 0; }

#slide {
  width: 1080px;
  height: 1350px;
  position: relative;
  overflow: hidden;
  background: #F7F3EC;
  color: #111;
  box-sizing: border-box;
  padding: 84px 72px;
  display: flex;
  flex-direction: column;
  font-family: 'Pretendard', sans-serif;
  word-break: keep-all;
  overflow-wrap: break-word;
  line-break: strict;
}

.corner { position: absolute; width: 44px; height: 44px; z-index: 2; }
.corner.tl { top: 36px; left: 36px; border-top: 6px solid #111; border-left: 6px solid #111; }
.corner.tr { top: 36px; right: 36px; border-top: 6px solid #111; border-right: 6px solid #111; }
.corner.bl { bottom: 36px; left: 36px; border-bottom: 6px solid #111; border-left: 6px solid #111; }
.corner.br { bottom: 36px; right: 36px; border-bottom: 6px solid #111; border-right: 6px solid #111; }

.kicker {
  position: relative; z-index: 1;
  font-weight: 800;
  font-size: 30px;
  color: __ACCENT_HEX__;
  letter-spacing: 0.5px;
  margin-bottom: 26px;
}

.main-block {
  flex: 1;
  min-height: 0;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.title {
  font-family: 'Jua', 'Pretendard', sans-serif;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -1px;
  color: #111;
  margin: 0 0 40px 0;
}

.subtitle {
  font-weight: 600;
  font-size: 38px;
  line-height: 1.55;
  color: rgba(17,17,17,0.62);
}

.page-footer {
  position: absolute;
  bottom: 46px;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.page-dash { width: 26px; height: 3px; background: __ACCENT_HEX__; border-radius: 2px; }
.page-num { font-weight: 700; font-size: 26px; color: #111; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="slide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="kicker">__KICKER_TEXT__</div>
    <div class="main-block">
      <h1 class="title" style="__TITLE_STYLE__">__TITLE__</h1>
      <div class="subtitle">__SUBTITLE__</div>
    </div>
    <div class="page-footer">
      <span class="page-dash"></span>
      <span class="page-num">__PAGE_NUM__ / __TOTAL_PAGES__</span>
      <span class="page-dash"></span>
    </div>
  </div>
</body>
</html>
