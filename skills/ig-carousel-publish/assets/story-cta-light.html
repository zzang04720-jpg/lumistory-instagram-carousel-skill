<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  __FONT_FACE_CSS__
  html, body { margin: 0; padding: 0; }

  #slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #FAF7F2;
    color: #111;
    box-sizing: border-box;
    padding: 88px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-family: 'Pretendard', sans-serif;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .corner { position: absolute; width: 46px; height: 46px; z-index: 2; }
  .corner.tl { top: 40px; left: 40px; border-top: 6px solid __ACCENT_HEX__; border-left: 6px solid __ACCENT_HEX__; }
  .corner.tr { top: 40px; right: 40px; border-top: 6px solid __ACCENT_HEX__; border-right: 6px solid __ACCENT_HEX__; }
  .corner.bl { bottom: 40px; left: 40px; border-bottom: 6px solid __ACCENT_HEX__; border-left: 6px solid __ACCENT_HEX__; }
  .corner.br { bottom: 40px; right: 40px; border-bottom: 6px solid __ACCENT_HEX__; border-right: 6px solid __ACCENT_HEX__; }

  .headline {
    position: relative; z-index: 1;
    font-family: '__HANDWRITING_FONT__', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 88px;
    line-height: 1.5;
    margin: 60px 0 56px 0;
  }

  .comment-card {
    position: relative; z-index: 1;
    background: #fff;
    border: 3px solid #111;
    border-radius: 26px;
    padding: 56px 46px;
    box-shadow: 10px 10px 0 __ACCENT_HEX__;
    width: 100%;
    box-sizing: border-box;
  }
  .comment-card .lead { font-weight: 700; font-size: 34px; color: rgba(17,17,17,0.7); margin-bottom: 22px; }
  .comment-card .keyword-box {
    display: inline-block;
    font-family: '__HANDWRITING_FONT__', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 80px;
    line-height: 1.5;
    color: #fff;
    background: __ACCENT_HEX__;
    border: 3px solid #111;
    padding: 18px 44px;
    border-radius: 16px;
    margin-bottom: 30px;
    transform: rotate(-1.5deg);
  }
  .comment-card .desc { font-weight: 700; font-size: 36px; line-height: 1.5; color: #111; }

  .guide-text {
    position: relative; z-index: 1;
    margin-top: 48px;
    font-weight: 800;
    font-size: 36px;
    color: #111;
  }
  .small-text {
    position: relative; z-index: 1;
    margin-top: 14px;
    font-weight: 600;
    font-size: 28px;
    color: rgba(17,17,17,0.55);
  }
  .small-text .accent { color: __ACCENT_HEX__; font-weight: 800; }

  .progress {
    position: absolute;
    bottom: 58px;
    right: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 28px;
    color: rgba(17,17,17,0.4);
    z-index: 2;
  }
  .handle-mark {
    position: absolute;
    bottom: 58px;
    left: 100px;
    font-weight: 600;
    font-size: 26px;
    color: rgba(17,17,17,0.35);
    z-index: 2;
  }
</style>
</head>
<body>
  <div id="slide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="headline">__HEADLINE__</div>
    <div class="comment-card">
      <div class="lead">댓글에 이 키워드만 남겨주세요</div>
      <div class="keyword-box">__COMMENT_KEYWORD__</div>
      <div class="desc">__DESC_TEXT__</div>
    </div>
    <div class="guide-text">__GUIDE_TEXT__</div>
    <div class="small-text">__SMALL_TEXT__</div>
    <div class="handle-mark">@__HANDLE__</div>
    <div class="progress">__PAGE_NUM__/__TOTAL_PAGES__</div>
  </div>
</body>
</html>
