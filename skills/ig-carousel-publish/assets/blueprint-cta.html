<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
__FONT_FACE_CSS__
html, body { margin: 0; padding: 0; }

#slide {
  width: 1080px;
  height: 1350px;
  position: relative;
  overflow: hidden;
  background: #F7F3EC;
  color: #111;
  box-sizing: border-box;
  padding: 84px 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  font-family: 'Pretendard', sans-serif;
  word-break: keep-all;
  overflow-wrap: break-word;
}

.corner { position: absolute; width: 44px; height: 44px; z-index: 2; }
.corner.tl { top: 36px; left: 36px; border-top: 6px solid #111; border-left: 6px solid #111; }
.corner.tr { top: 36px; right: 36px; border-top: 6px solid #111; border-right: 6px solid #111; }
.corner.bl { bottom: 36px; left: 36px; border-bottom: 6px solid #111; border-left: 6px solid #111; }
.corner.br { bottom: 36px; right: 36px; border-bottom: 6px solid #111; border-right: 6px solid #111; }

.kicker {
  position: relative; z-index: 1;
  align-self: flex-start;
  font-weight: 800;
  font-size: 28px;
  color: __ACCENT_HEX__;
  letter-spacing: 0.5px;
  margin-bottom: 20px;
}

.headline {
  position: relative; z-index: 1;
  font-family: 'Jua', 'Pretendard', sans-serif;
  font-weight: 700;
  font-size: 64px;
  line-height: 1.4;
  letter-spacing: -0.5px;
  margin: 20px 0 30px 0;
}
.headline .accent { color: __ACCENT_HEX__; }

.explain {
  position: relative; z-index: 1;
  font-weight: 600;
  font-size: 32px;
  line-height: 1.55;
  color: rgba(17,17,17,0.6);
  margin-bottom: 46px;
}

.comment-box {
  position: relative; z-index: 1;
  width: 100%;
  box-sizing: border-box;
  background: #fff;
  border: 3px solid #111;
  border-radius: 26px;
  padding: 54px 44px;
}
.comment-box .bubble { font-size: 40px; color: rgba(17,17,17,0.35); margin-bottom: 18px; line-height: 1; }
.comment-box .lead { font-weight: 700; font-size: 32px; color: #111; line-height: 1.5; }
.comment-box .lead .accent { color: __ACCENT_HEX__; }
.comment-box .desc { margin-top: 14px; font-weight: 700; font-size: 32px; color: #111; line-height: 1.5; }

.guide-row {
  position: relative; z-index: 1;
  margin-top: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 26px;
  color: rgba(17,17,17,0.6);
}
.guide-row .accent { color: __ACCENT_HEX__; font-weight: 800; text-decoration: underline; text-decoration-color: __ACCENT_HEX__; text-underline-offset: 4px; }

.page-footer {
  position: absolute;
  bottom: 46px;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.page-dash { width: 26px; height: 3px; background: __ACCENT_HEX__; border-radius: 2px; }
.page-num { font-weight: 700; font-size: 26px; color: #111; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="slide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="kicker">__KICKER_TEXT__</div>
    <div class="headline">__HEADLINE__</div>
    <div class="explain">__EXPLAIN_TEXT__</div>
    <div class="comment-box">
      <div class="bubble">💬</div>
      <div class="lead">__COMMENT_LEAD__</div>
      <div class="desc">__DESC_TEXT__</div>
    </div>
    <div class="guide-row">
      <span>⭐</span>
      <span>__GUIDE_TEXT__</span>
    </div>
    <div class="page-footer">
      <span class="page-dash"></span>
      <span class="page-num">__PAGE_NUM__ / __TOTAL_PAGES__</span>
      <span class="page-dash"></span>
    </div>
  </div>
</body>
</html>
